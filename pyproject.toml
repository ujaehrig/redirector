[project]
name = "redirector"
version = "0.1.0"
description = "A minimal URL redirection service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic-settings>=2.6.0",
    "click>=8.1.0",
    "pyjwt>=2.13.0",
    "cryptography>=50.0.0",
]

[project.scripts]
redirector = "redirector.main:main"
redirector-manage = "redirector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redirector"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "httpx2>=2.12.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=redirector --cov-report=term-missing --cov-branch"

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/redirector/routes.py" = ["B008"]  # Depends() in defaults is FastAPI convention

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
